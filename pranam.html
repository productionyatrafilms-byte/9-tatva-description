<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-lang-key="pranam"></title>
  <link rel="stylesheet" href="./fontawesome/css/fontawesome.min.css" />
  <link rel="stylesheet" href="./fontawesome/css/solid.min.css" />
  <link rel="stylesheet" href="./assets/css/style.css" />
</head>
<style>
  .cloud {
    width: 42vw;
    position: absolute;
    z-index: 500;
  }

  .cloud img,
  .small-cloud img {
    width: 100%;
    display: block;
    object-fit: contain;
  }

  .left-cloud {
    left: 0%;
    bottom: -5vw;
    transform: translateX(-120%);
    animation: leftCloudCome 1.2s ease forwards;
  }

  .right-cloud {
    right: -0%;
    bottom: -5vw;
    transform: translateX(120%);
    animation: rightCloudCome 1.2s ease forwards;
  }

  @keyframes leftCloudCome {
    0% {
      transform: translateX(-120%);
    }

    100% {
      transform: translateX(0);
    }
  }

  @keyframes rightCloudCome {
    0% {
      transform: translateX(120%);
    }

    100% {
      transform: translateX(0);
    }
  }
</style>

<body>
  <a href="tatva.html?slide=8" class="back-btn">
    <i class="fa-solid fa-arrow-left"></i>
  </a>
  <div class="language-container">
    <div class="english active">E</div>
    <div class="hindi">H</div>
    <div class="gujrati">G</div>
  </div>

  <div class="cloud left-cloud">
    <img src="./assets/images/left-cloud.png" alt="" />
  </div>
  <div class="cloud right-cloud">
    <img src="./assets/images/right-cloud.png" alt="" />
  </div>
  <div class="pranam-container">
    <div class="pranam-img">
      <div class="pranam-video">
        <video src="./assets/videos/pranam.mp4" autoplay muted loop playsinline></video>
      </div>
      <span data-lang-key="pranam"></span>
      <img src="./assets/images/pranam-img.png" alt="" />
    </div>
    <a href="index.html" class="home-btn-1">
      <span data-lang-key="home"></span>
      <img src="./assets/images/home-btn-1.png" alt="" />
    </a>
  </div>
    <script src="./assets/js/djp.js"></script>
  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/app.js"></script>
  <script>
    (function () {
      "use strict";

      const pranamSound = new Audio("./assets/audio/pranam.mp3");
      pranamSound.preload = "auto";

      let pranamHasPlayed = false;

      function playPranamOnce() {
        if (pranamHasPlayed) return;
        pranamHasPlayed = true;

        const playPromise = pranamSound.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // browser blocked autoplay, retry on the first real interaction
            pranamHasPlayed = false;
            waitForInteraction();
          });
        }
      }

      function waitForInteraction() {
        const trigger = () => {
          document.removeEventListener("click", trigger);
          document.removeEventListener("keydown", trigger);
          document.removeEventListener("touchstart", trigger);
          playPranamOnce();
        };

        document.addEventListener("click", trigger, { once: true });
        document.addEventListener("keydown", trigger, { once: true });
        document.addEventListener("touchstart", trigger, { once: true });
      }

      window.addEventListener("DOMContentLoaded", playPranamOnce);
    })();
  </script>
</body>

</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-lang-key="title-1"></title>
  <link rel="stylesheet" href="./assets/css/style.css" />
  <link rel="stylesheet" href="./fontawesome/css/fontawesome.min.css" />
  <link rel="stylesheet" href="./fontawesome/css/solid.min.css" />
  <link rel="stylesheet" href="./assets/css/swiper-bundle.min.css" />
</head>

<style>
  .bottom-layer {
    position: fixed;
    width: 100%;
    height: 15vw;
    bottom: -2vw;
    overflow: visible;
    z-index: 1000;
  }

  .wave-1 {
    position: absolute;
    width: 100vw;
    top: -2vw;
    left: -22vw;
    animation: waveMoveLeftRight 2s ease-in-out infinite alternate;
    z-index: 1;
  }

  .wave-2 {
    position: absolute;
    width: 100%;
    right: 25vw;
    animation: waveMoveRightLeft 2s ease-in-out infinite alternate;
    z-index: 3;
    bottom: -10vw;
  }

  .wave-1 img,
  .wave-2 img {
    width: 150vw;
    object-fit: cover;
    display: block;
  }

  @keyframes waveMoveLeftRight {
    from {
      transform: translateX(0) translateY(0);
    }

    to {
      transform: translateX(-4vw) translateY(-0.8vw);
    }
  }

  @keyframes waveMoveRightLeft {
    from {
      transform: translateX(0) translateY(-0.8vw);
    }

    to {
      transform: translateX(4vw) translateY(0);
    }
  }

  .boat {
    position: absolute;
    top: -60%;
    width: 22vw;
    left: 5%;
    transform: translateX(0) rotate(0deg);
    transition: transform 0.8s ease-in-out;
    z-index: 2;
  }

  .boat img {
    width: 100%;
    display: block;
    object-fit: contain;
  }

  .cloud {
    width: 42vw;
    position: absolute;
    z-index: 500;
  }

  .cloud img,
  .small-cloud img {
    width: 100%;
    display: block;
    object-fit: contain;
  }

  .left-cloud {
    left: 0%;
    bottom: -2vw;
    transform: translateX(-120%);
    animation: leftCloudCome 1.2s ease forwards;
  }

  .right-cloud {
    right: -0%;
    bottom: -2vw;
    transform: translateX(120%);
    animation: rightCloudCome 1.2s ease forwards;
  }

  @keyframes leftCloudCome {
    0% {
      transform: translateX(-120%);
    }

    100% {
      transform: translateX(0);
    }
  }

  @keyframes rightCloudCome {
    0% {
      transform: translateX(120%);
    }

    100% {
      transform: translateX(0);
    }
  }

  .small-cloud {
    width: 10vw;
    position: absolute;
    z-index: 99999;
  }

  .small-left {
    left: 20%;
    top: 23%;
  }

  .small-left img {
    width: 78%;
  }

  .small-right {
    left: 75%;
    top: 10%;
  }

  .title {
    position: absolute;
    top: 2vw;
    left: 50%;
    transform: translateX(-50%);
    width: 15vw;
    height: 4vw;
    font-size: 2.2vw;
    color: #4065bd;
    border: 0.2vw solid white;
    background-color: #f2f6ff;
    border-radius: 3vw;
    text-shadow: -0.1vw 0.2vw 0.1vw #4066bd50;
    text-align: center;
    display: flex;
    justify-content: center;
    font-family: "MeriendaOne";
    padding: 0.2vw 0.5vw;
    align-items: center;
    line-height: 1;
    gap: 1vw;
    z-index: 100000;
  }

  .video-container {
    position: fixed;
    bottom: -1vw;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 45vw;
    height: 28vw;
    border-radius: 2vw;
    overflow: hidden;
    z-index: 20;
    pointer-events: auto;
    box-shadow: 0 1vw 2vw rgba(0, 0, 0, 0.25);
    border: 0.5vw solid white;
    background-color: black;
  }

  .mySwiper,
  .swiper-wrapper,
  .swiper-slide {
    width: 100%;
    height: 100%;
  }

  .swiper-slide video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .content-container {
    position: fixed;
    left: 50%;
    bottom: 3vw;
    transform: translateX(-50%);
    width: 40vw;
    min-height: 5vw;
    height: auto;
    padding: 0.5vw;
    border-radius: 1vw;
    background: linear-gradient(180deg, #ffe7ab 10%, #ffe2e4 100%);
    border: 0.3vw solid white;
    text-align: center;
    z-index: 1001;
    pointer-events: auto;
    font-family: "YesevaOne";
    color: #843e00;
    font-size: 1.5vw;
    line-height: 1.3;
    box-shadow: 0 0.5vw 1vw rgba(0, 0, 0, 0.2);
  }

  .swiper-nav-btn {
    position: fixed;
    bottom:22vw;
    transform: translateY(-50%);
    width: 5vw;
    height: 5vw;
    z-index: 100000;
    cursor: pointer;
    pointer-events: auto;
    transition: transform 0.3s ease;
  }

  .swiper-nav-btn:hover {
    transform: translateY(-50%) scale(1.08);
  }

  .prev-btn {
    left: 20vw;
    display: none;
  }

  .next-btn {
    right: 20vw;
  }

  .swiper-nav-btn img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }

  /* Pranam link - hidden by default, shown only on the last slide */
  .pranam-link {
    position: fixed;
    display: flex;
    justify-content: center;
    align-items: center;
    right: 5vw;
    bottom: 2vw;
    width: 9vw;
    height: auto;
    text-decoration: none;
    z-index: 100000;
    cursor: pointer;
    transform-origin: center;
    animation: pranamPop 1.2s ease-in-out infinite;

    opacity: 0;
    visibility: hidden;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }

  .pranam-link.show {
    opacity: 1;
    visibility: visible;
    pointer-events: auto;
  }

  .pranam-link img {
    position: relative;
    width: 100%;
    display: block;
    object-fit: contain;
  }

  .pranam-link span {
    position: absolute;
    text-decoration: none;
    color: white;
    font-weight: bold;
    font-size: 1.3vw;
    padding-right: 1vw;
    font-family: "BalooRegular";
  }

  @keyframes pranamPop {
    0% {
      transform: scale(1);
    }

    50% {
      transform: scale(1.12);
    }

    100% {
      transform: scale(1);
    }
  }
</style>

<body>
  <a class="home-button home-btn" href="index.html">
    <img src="./assets/images/home-btn.png" alt="" />
  </a>

  <div class="title">
    <span class="num" data-lang-key="num.1"></span>
    <span class="text" data-lang-key="topic-1"></span>
  </div>

  <div class="video-container">
    <div class="swiper mySwiper">
      <div class="swiper-wrapper">
        <div class="swiper-slide">
          <video src="./assets/videos/1.mp4" autoplay muted loop playsinline></video>
        </div>

        <div class="swiper-slide">
          <video src="./assets/videos/2.mp4" muted loop playsinline></video>
        </div>

        <div class="swiper-slide">
          <video src="./assets/videos/3.mp4" muted loop playsinline></video>
        </div>

        <div class="swiper-slide">
          <video src="./assets/videos/4.mp4" muted loop playsinline></video>
        </div>

        <div class="swiper-slide">
          <video src="./assets/videos/5.mp4" muted loop playsinline></video>
        </div>

        <div class="swiper-slide">
          <video src="./assets/videos/6.mp4" muted loop playsinline></video>
        </div>

        <div class="swiper-slide">
          <video src="./assets/videos/7.mp4" muted loop playsinline></video>
        </div>

        <div class="swiper-slide">
          <video src="./assets/videos/8.mp4" muted loop playsinline></video>
        </div>

        <div class="swiper-slide">
          <video src="./assets/videos/9.mp4" muted loop playsinline></video>
        </div>
      </div>
    </div>
  </div>

  <div class="content-container active-content" data-lang-key="slide-1"></div>

  <div class="swiper-nav-btn prev-btn">
    <img src="./assets/images/prev-btn.png" alt="" />
  </div>

  <div class="swiper-nav-btn next-btn">
    <img src="./assets/images/next-btn.png" alt="" />
  </div>

  <a href="pranam.html" class="pranam-link">
    <img src="./assets/images/arowAsset.png" alt="" />
    <span data-lang-key="pranam"></span>
  </a>

  <div class="language-container">
    <div class="english active">E</div>
    <div class="hindi">H</div>
    <div class="gujrati">G</div>
  </div>

  <div class="cloud left-cloud">
    <img src="./assets/images/left-cloud.png" alt="" />
  </div>

  <div class="cloud right-cloud">
    <img src="./assets/images/right-cloud.png" alt="" />
  </div>

  <div class="small-cloud small-left">
    <img src="./assets/images/left-small-cloud.png" alt="" />
  </div>

  <div class="small-cloud small-right">
    <img src="./assets/images/right-small-cloud.png" alt="" />
  </div>

  <div class="bottom-layer">
    <div class="waves wave-1">
      <img src="./assets/images/wave1.png" alt="" />
    </div>

    <div class="boat">
      <img src="./assets/images/boat.png" alt="" />
    </div>

    <div class="waves wave-2">
      <img src="./assets/images/wave2.png" alt="" />
    </div>
  </div>
    <script src="./assets/js/djp.js"></script>

  <script src="./assets/js/data.js"></script>
  <script src="./assets/js/app.js"></script>
  <script src="./assets/js/swiper-bundle.min.js"></script>

  <script>
    const prevBtn = document.querySelector(".prev-btn");
    const nextBtn = document.querySelector(".next-btn");
    const pranamLink = document.querySelector(".pranam-link");
    const boat = document.querySelector(".boat");
    const activeContent = document.querySelector(".active-content");

    const titleNum = document.querySelector(".title .num");
    const titleText = document.querySelector(".title .text");

    const urlParams = new URLSearchParams(window.location.search);
    const startSlide = Number(urlParams.get("slide")) || 0;

    const swiper = new Swiper(".mySwiper", {
      speed: 700,
      allowTouchMove: false,
      initialSlide: startSlide,

      on: {
        init: function () {
          updateButtons(this);
          playActiveVideo(this);
          moveBoat(this.activeIndex);
          updateActiveContent(this);
        },

        slideChange: function () {
          updateButtons(this);
          playActiveVideo(this);
          moveBoat(this.activeIndex);
          updateActiveContent(this);
        },
      },
    });

    function updateButtons(swiperInstance) {
      if (swiperInstance.activeIndex === 0) {
        prevBtn.style.display = "none";
      } else {
        prevBtn.style.display = "block";
      }

      const isLast = swiperInstance.activeIndex === swiperInstance.slides.length - 1;

      nextBtn.style.opacity = isLast ? "0" : "1";
      nextBtn.style.pointerEvents = isLast ? "none" : "auto";

      if (pranamLink) {
        pranamLink.classList.toggle("show", isLast);
      }
    }

    function updateActiveContent(swiperInstance) {
      const activeIndex = swiperInstance.activeIndex + 1;

      activeContent.setAttribute("data-lang-key", `slide-${activeIndex}`);

      titleNum.setAttribute("data-lang-key", `num.${activeIndex}`);
      titleText.setAttribute("data-lang-key", `topic-${activeIndex}`);

      const selectedLang =
        localStorage.getItem("selectedLanguage") || "English";

      if (typeof applyLanguage === "function") {
        applyLanguage(selectedLang);
      }
    }

    function playActiveVideo(swiperInstance) {
      const allVideos = document.querySelectorAll(".swiper-slide video");

      allVideos.forEach((video) => {
        video.pause();
        video.currentTime = 0;
      });

      const activeVideo =
        swiperInstance.slides[swiperInstance.activeIndex].querySelector(
          "video",
        );

      if (activeVideo) {
        activeVideo.play();
      }
    }

    function moveBoat(index) {
      const moveX = index * 8;
      const rotateDeg = index % 2 === 0 ? -5 : 10;

      boat.style.transform = `translateX(${moveX}vw) rotate(${rotateDeg}deg)`;
    }

    prevBtn.addEventListener("click", () => {
      swiper.slidePrev();
    });

    nextBtn.addEventListener("click", () => {
      swiper.slideNext();
    });
  </script>
</body>
</html>
